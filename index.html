<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>小说续写工作台</title>
    <meta name="description" content="单文件、零依赖的小说续写工具：把一整本小说丢进去，让 AI 顺着原作的文风、人物和伏笔继续往下写。">
    <!-- GitHub Pages 入口：直接跳到成品单文件 -->
    <meta http-equiv="refresh" content="0; url=novel-continue-standalone.html">
    <link rel="canonical" href="novel-continue-standalone.html">
    <style>
        :root {
            color-scheme: light dark;
            --bg: #0d1117;
            --fg: #e6edf3;
            --dim: #8b949e;
            --accent: #2f81f7;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg: #f6f8fa;
                --fg: #1f2328;
                --dim: #656d76;
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: var(--bg);
            color: var(--fg);
            font: 15px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC",
                "PingFang SC", "Microsoft YaHei", sans-serif;
            padding: 24px;
        }

        .card {
            max-width: 34rem;
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0 0 .5rem;
            letter-spacing: .01em;
        }

        p {
            color: var(--dim);
            margin: 0 0 1.75rem;
        }

        a.btn {
            display: inline-block;
            padding: .6rem 1.4rem;
            border-radius: .5rem;
            background: var(--accent);
            color: #fff;
            text-decoration: none;
            font-weight: 600;
        }

        a.btn:hover {
            filter: brightness(1.1);
        }

        .note {
            margin-top: 1.75rem;
            font-size: .8rem;
            color: var(--dim);
        }

        .bar {
            width: 100%;
            height: 3px;
            border-radius: 3px;
            background: var(--dim);
            opacity: .25;
            overflow: hidden;
            margin-top: 1.5rem;
        }

        .bar::after {
            content: "";
            display: block;
            width: 35%;
            height: 100%;
            background: var(--accent);
            animation: slide 1.1s ease-in-out infinite;
        }

        @keyframes slide {
            0% {
                transform: translateX(-100%);
            }

            100% {
                transform: translateX(340%);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .bar::after {
                animation: none;
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>小说续写工作台</h1>
        <p>正在打开……</p>
        <a class="btn" href="novel-continue-standalone.html">立即打开</a>
        <div class="bar"></div>
        <p class="note">
            纯前端单文件，API Key 只保存在你自己的浏览器里，不经过任何第三方服务器。<br>
            没自动跳转的话，点上面的按钮。想看说明请到
            <a href="https://github.com/zhangjieyyds5/novel-continuation#readme">仓库首页</a>。
        </p>
    </div>
    <script>
        // meta refresh 在某些浏览器扩展下会被拦，这里补一次
        location.replace('novel-continue-standalone.html');
    </script>
</body>

</html>
